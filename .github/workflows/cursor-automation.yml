name: Trigger Cursor Automation

on:
  push:
    branches-ignore:
      - main
      - master
      - dev

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cursor webhook
        env:
          URL: ${{ secrets.CURSOR_AUTOMATION_URL }}
          KEY: ${{ secrets.CURSOR_AUTOMATION_KEY }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SERVER: ${{ github.server_url }}
        run: |
          jq -n \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg repo "$REPO" \
            --arg msg "$COMMIT_MSG" \
            --arg server "$SERVER" \
            '{
              context: (
                "Branch: \($branch)\n" +
                "SHA: \($sha)\n" +
                "Repo: \($repo)\n" +
                "Commit message: \($msg)\n" +
                "URL: \($server)/\($repo)/commit/\($sha)"
              )
            }' | curl -X POST "$URL" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
