# Local SonarQube settings for PcBuilder.
# Tokens are not stored here — set SONAR_TOKEN in the environment, or pass
# /d:sonar.token=... to dotnet sonarscanner.
#
# This file is gitignored by sonar-*.* in the repo-root .gitignore.
# C# analysis still requires SonarScanner for .NET (dotnet sonarscanner),
# not the generic sonar-scanner CLI.

sonar.projectKey=PcBuilder
sonar.projectName=PcBuilder
sonar.organization=builtbyfelixcheung
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/.grok/**,**/node_modules/**,**/.sonarqube/**,**/bin/**,**/obj/**,**/wwwroot/**,**/Persistence/Migrations/**,**/Persistence/Identity/Migrations/**
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test/**,**/main.tsx,**/Persistence/Migrations/**,**/Persistence/Identity/Migrations/**
